[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytgflow"
version = "1.8.2"
description = "Pure Python MTProto 2.0 Telegram framework engineered for speed, clean architecture, and modern bot development"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "VeezNetworks" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5.2",
    "sphinx-inline-tabs>=2023.4.21",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/VeezNetworks/TgFlow"
Documentation = "https://tgflow.veez.dev"
Repository = "https://github.com/VeezNetworks/TgFlow.git"
Issues = "https://github.com/VeezNetworks/TgFlow/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tgflow*"]

[tool.setuptools.package-data]
tgflow = ["py.typed"]
